{% extends "base.html" %}
{% block title %}修改密码 - 学生选题系统{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
  <h3>🔒 修改密码</h3>
  <p class="flow-tip">修改密码需要验证原密码；新密码长度至少 6 位。管理员也可在「用户管理」中帮你重置密码。</p>
  <form method="post" class="vform">
    {{ csrf_input() }}
    <div class="form-item"><label>原密码</label>
      <input type="password" name="old_password" required placeholder="请输入当前密码"></div>
    <div class="form-item"><label>新密码</label>
      <input type="password" name="new_password" required placeholder="至少 6 位" minlength="6"></div>
    <div class="form-item"><label>确认新密码</label>
      <input type="password" name="confirm_password" required placeholder="再输一次新密码"></div>
    <button class="btn btn-primary" type="submit">确认修改</button>
    <a class="btn btn-default" href="{{ url_for('index') }}">返回</a>
  </form>
</div>
{% endblock %}
